name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements_standalone.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements_standalone.txt
          pip install pyinstaller
          
      - name: Install Node dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile
          
      - name: Build backend executable
        run: |
          cd backend
          python build_executable.py
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          
      - name: Prepare frontend build
        run: |
          cd frontend
          mkdir -p backend
          ls -la ../backend/ || dir ..\backend\ || echo "Backend directory contents:"
          
      - name: Copy backend files (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd frontend
          cp -r ../backend/dist/* backend/ || echo "No backend dist files"
          cp ../backend/gst_data.db backend/ || echo "No database file"
        shell: bash
          
      - name: Copy backend files (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd frontend
          if (Test-Path "../backend/dist") { Copy-Item -Path "../backend/dist/*" -Destination "backend/" -Recurse -Force }
          if (Test-Path "../backend/gst_data.db") { Copy-Item -Path "../backend/gst_data.db" -Destination "backend/" -Force }
        shell: powershell
          
      - name: Build React app
        run: |
          cd frontend
          yarn build
          
      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd frontend
          yarn electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd frontend
          yarn electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          
      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd frontend
          yarn electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: List built files
        run: |
          echo "Contents of frontend/dist:"
          ls -la frontend/dist/ || echo "No dist directory found"
          
      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v3
        with:
          name: windows-installer
          path: |
            frontend/dist/*.exe
            frontend/dist/*.msi
          if-no-files-found: warn
          
      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v3
        with:
          name: macos-installer
          path: |
            frontend/dist/*.dmg
            frontend/dist/*.pkg
          if-no-files-found: warn
          
      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v3
        with:
          name: linux-installer
          path: |
            frontend/dist/*.AppImage
            frontend/dist/*.deb
            frontend/dist/*.rpm
          if-no-files-found: warn

  create-release:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download Windows artifacts
        uses: actions/download-artifact@v3
        with:
          name: windows-installer
          path: ./dist/
          
      - name: Download macOS artifacts
        uses: actions/download-artifact@v3
        with:
          name: macos-installer
          path: ./dist/
          
      - name: Download Linux artifacts
        uses: actions/download-artifact@v3
        with:
          name: linux-installer
          path: ./dist/
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./dist/*
          name: GST Pro ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
